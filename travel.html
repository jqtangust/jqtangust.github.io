    <style>
        .travel-map {
            margin-top: 20px;
        }

        .travel-map-canvas {
            position: relative;
        }

        .travel-map-canvas > img {
            display: block;
            width: 100%;
            height: auto;
        }

        .travel-pin {
            position: absolute;
            box-sizing: border-box;
            width: 12px;
            height: 12px;
            padding: 0;
            border: 2px solid #fff;
            border-radius: 50%;
            background: #1772d0;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15), 0 1px 4px rgba(0, 0, 0, 0.3);
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform .15s ease-in-out, background-color .15s ease-in-out;
            z-index: 1;
        }

        .travel-pin:hover,
        .travel-pin:focus-visible,
        .travel-pin.is-active {
            z-index: 2;
            background: #f09228;
            transform: translate(-50%, -50%) scale(1.35);
        }

        .travel-pin.is-plain {
            z-index: 0;
            width: 10px;
            height: 10px;
            border-color: #1772d0;
            background: #fff;
        }

        .travel-pin.is-plain:hover,
        .travel-pin.is-plain:focus-visible,
        .travel-pin.is-plain.is-active {
            z-index: 2;
            border-color: #f09228;
            background: #fff;
        }

        .travel-popup {
            position: absolute;
            z-index: 10;
            box-sizing: border-box;
            max-width: 100%;
            padding: 8px;
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
        }

        .travel-popup > * + * {
            margin-top: 8px;
        }

        .travel-popup-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .travel-popup-item {
            flex: 0 0 260px;
        }

        .travel-popup-item img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 340px;
            object-fit: cover;
            border-radius: 6px;
            background: #eef1f5;
        }

        .travel-popup-item p {
            margin: 8px 2px 0;
            font-size: 13px;
            line-height: 1.4;
            color: #444;
        }

        .travel-popup-note {
            margin: 0;
            padding: 0 2px;
            font-size: 13px;
            line-height: 1.4;
            color: #444;
        }

        @media (max-width: 600px) {
            .travel-pin {
                width: 10px;
                height: 10px;
            }

            .travel-pin.is-plain {
                width: 8px;
                height: 8px;
            }
        }
    </style>

    <script>
        (function () {
            var mapEl = document.getElementById('travel-map');
            var canvas = mapEl.querySelector('.travel-map-canvas');
            var cards = document.getElementById('travel-places').content
                .querySelectorAll('.travel-card[data-lat][data-lng]');
            if (!cards.length) return;
            mapEl.hidden = false;

            // Pin positions must match images/world-map.svg: Miller projection cropped to 84°N-58°S.
            function millerY(lat) {
                return 1.25 * Math.log(Math.tan(Math.PI / 4 + 0.4 * lat * Math.PI / 180));
            }
            var yTop = millerY(84), yBottom = millerY(-58);

            var places = {};
            cards.forEach(function (card) {
                var key = card.dataset.lat + ',' + card.dataset.lng;
                if (!places[key]) {
                    var pin = document.createElement('button');
                    pin.type = 'button';
                    pin.className = 'travel-pin is-plain';
                    pin.setAttribute('aria-label', card.dataset.name || card.querySelector('img').alt);
                    canvas.appendChild(pin);
                    places[key] = {
                        pin: pin,
                        cards: [],
                        plain: true,
                        fx: (+card.dataset.lng + 180) / 360,
                        fy: (yTop - millerY(+card.dataset.lat)) / (yTop - yBottom)
                    };
                }
                places[key].cards.push(card);
                if (card.querySelector('img')) {
                    places[key].plain = false;
                    places[key].pin.classList.remove('is-plain');
                }
            });
            var list = Object.keys(places).map(function (key) { return places[key]; });

            // Pins keep a fixed pixel size, so places a few km apart (e.g. Copenhagen and Malmö) would
            // stack on top of each other. Nudge overlapping pins apart just enough to tell them apart;
            // a place without a photo gives way to one with a photo.
            function layout() {
                var cw = canvas.clientWidth, ch = canvas.clientHeight;
                list.forEach(function (p) {
                    p.x = p.fx * cw;
                    p.y = p.fy * ch;
                    p.size = p.pin.offsetWidth;
                });
                for (var pass = 0; pass < 30; pass++) {
                    var moved = false;
                    list.forEach(function (a, i) {
                        list.slice(i + 1).forEach(function (b) {
                            var min = (a.size + b.size) / 2 + 2;
                            var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
                            if (d >= min) return;
                            if (!d) {
                                dx = 1;
                                d = 1;
                            }
                            var push = (min - d) / d, share = a.plain === b.plain ? 0.5 : a.plain ? 1 : 0;
                            a.x -= dx * push * share;
                            a.y -= dy * push * share;
                            b.x += dx * push * (1 - share);
                            b.y += dy * push * (1 - share);
                            moved = true;
                        });
                    });
                    if (!moved) break;
                }
                list.forEach(function (p) {
                    p.pin.style.left = Math.max(0, Math.min(cw, p.x)) + 'px';
                    p.pin.style.top = Math.max(0, Math.min(ch, p.y)) + 'px';
                });
            }
            layout();

            var popup = document.createElement('div');
            popup.className = 'travel-popup';
            popup.hidden = true;
            canvas.appendChild(popup);

            var current = null;
            var hideTimer;

            function position() {
                var x = current.pin.offsetLeft, y = current.pin.offsetTop;
                var w = popup.offsetWidth, h = popup.offsetHeight, cw = canvas.clientWidth;
                // Try spots around the pin in order of preference and keep the one hiding the fewest
                // other pins, so neighbouring places stay reachable while the popup is open.
                var spots = [];
                [12, 28].forEach(function (gap) {
                    spots.push(
                        [x - w / 2, y - h - gap], [x - w / 2, y + gap], [x + gap, y - h / 2], [x - w - gap, y - h / 2],
                        [x + gap, y - h - gap], [x - w - gap, y - h - gap], [x + gap, y + gap], [x - w - gap, y + gap]
                    );
                });
                var best = null, bestCost = Infinity;
                spots.forEach(function (s) {
                    var left = Math.max(0, Math.min(s[0], cw - w)), top = s[1];
                    if (top < 0) return;
                    var cost = 0;
                    list.forEach(function (p) {
                        var px = p.pin.offsetLeft, py = p.pin.offsetTop, r = p.pin.offsetWidth / 2 + 2;
                        if (px > left - r && px < left + w + r && py > top - r && py < top + h + r) {
                            cost += p === current ? 10 : 1;
                        }
                    });
                    if (cost < bestCost) {
                        best = [left, top];
                        bestCost = cost;
                    }
                });
                popup.style.left = best[0] + 'px';
                popup.style.top = best[1] + 'px';
            }

            function show(place) {
                clearTimeout(hideTimer);
                if (place === current) return;
                current = place;
                popup.textContent = '';
                var row = null;
                place.cards.forEach(function (card) {
                    var link = card.querySelector('a');
                    var caption = card.querySelector('p').cloneNode(true);
                    if (!link) {
                        caption.className = 'travel-popup-note';
                        popup.appendChild(caption);
                        row = null;
                        return;
                    }
                    if (!row) {
                        row = document.createElement('div');
                        row.className = 'travel-popup-row';
                        popup.appendChild(row);
                    }
                    var item = document.createElement('div');
                    item.className = 'travel-popup-item';
                    item.appendChild(link.cloneNode(true));
                    item.appendChild(caption);
                    item.querySelector('img').addEventListener('load', function () {
                        if (current) position();
                    });
                    row.appendChild(item);
                });
                list.forEach(function (p) { p.pin.classList.toggle('is-active', p === place); });
                popup.hidden = false;
                position();
            }

            function hide() {
                clearTimeout(hideTimer);
                current = null;
                popup.hidden = true;
                list.forEach(function (p) { p.pin.classList.remove('is-active'); });
            }

            function hideSoon() {
                clearTimeout(hideTimer);
                hideTimer = setTimeout(hide, 200);
            }

            list.forEach(function (place) {
                place.pin.addEventListener('mouseenter', function () { show(place); });
                place.pin.addEventListener('focus', function () { show(place); });
                place.pin.addEventListener('click', function (e) { e.stopPropagation(); show(place); });
                place.pin.addEventListener('mouseleave', hideSoon);
                place.pin.addEventListener('blur', hideSoon);
            });
            popup.addEventListener('mouseenter', function () { clearTimeout(hideTimer); });
            popup.addEventListener('mouseleave', hideSoon);
            popup.addEventListener('focusin', function () { clearTimeout(hideTimer); });
            popup.addEventListener('focusout', hideSoon);
            document.addEventListener('click', function (e) { if (!popup.contains(e.target)) hide(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });
            window.addEventListener('resize', function () {
                layout();
                if (current) position();
            });
        })();
    </script>
